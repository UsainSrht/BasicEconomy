# BasicEconomy Configuration

# Root-Level Server Identifier
# Used for multi-server networks, cross-server sync, and audit logging
server-id: "survival-1"

# Storage Settings
# Supported types: H2, MYSQL, MARIADB, POSTGRESQL, MONGODB
storage:
  type: H2
  address: "localhost"
  port: 3306
  database: "basiceconomy"
  username: "root"
  password: ""
  # H2 specific setting
  h2-file: "database"
  # MongoDB specific settings
  mongodb-uri: "mongodb://localhost:27017"

# Multi-server Synchronization Settings
# Enable this if you are running this plugin on multiple servers using the same remote database.
sync:
  # Supported types: NONE, PLUGIN_MESSAGE, REDIS
  type: NONE
  # Redis settings (only used if type is REDIS)
  redis:
    host: "localhost"
    port: 6379
    password: ""
    channel: "basiceconomy:sync"

# Task settings
tasks:
  # How often (in seconds) should baltop be updated asynchronously?
  baltop-update-interval: 300
  # How often (in seconds) should offline caches be cleared?
  cache-cleanup-interval: 600

# Baltop Settings
baltop:
  # Maximum number of top accounts cached in memory from database
  cache-limit: 100
  # Number of top entries displayed in /baltop command by default
  display-top: 10
  # Display text when player position is beyond cache-limit (e.g. 100+)
  out-of-range-position: "100+"

# Players hidden from /baltop and baltop placeholders (stored as UUIDs)
baltop-hidden-players: []

# Payment History & Audit Settings
history:
  # Enable transaction logging and payment history features
  enabled: true
  
  # Number of transactions displayed per chat page
  page-size: 8
  
  # Database retention period in days (0 to retain indefinitely)
  retention-days: 30
  
  # How often (in seconds) the retention pruning task runs (default: 43200s = 12h)
  prune-interval: 43200
  
  # Dual-Tier CSV File Logging System
  logging:
    # Global daily transaction logs
    global:
      enabled: true
      # Path pattern relative to plugin data folder.
      # Supported placeholders: {date}, {time}, {server}
      file-pattern: "logs/global/{date}.csv"
      # Date format pattern used for {date}
      date-format: "yyyy-MM-dd"
      
    # Per-player transaction logs
    players:
      enabled: true
      # Path pattern relative to plugin data folder.
      # Supported placeholders: {player}, {uuid}, {date}, {time}, {server}
      file-pattern: "logs/players/{player}.csv"
      date-format: "yyyy-MM-dd"
      
    # Also log payment events to console
    log-to-console: false

  # Real-time alerts to staff when a transfer exceeds a threshold
  high-value-alert:
    enabled: true
    threshold: 50000.0
    permission: "basiceconomy.alert.highvalue"

# Commands
commands:
  money:
    name: "money"
    aliases:
      - balance
      - bal
    permission: "basiceconomy.command.money"
    subcommands:
      add:
        name: "add"
        aliases:
          - give
          - grant
        permission: "basiceconomy.command.money.admin"
      set:
        name: "set"
        aliases: []
        permission: "basiceconomy.command.money.admin"
      remove:
        name: "remove"
        aliases: []
        permission: "basiceconomy.command.money.admin"
      send:
        name: "send"
        aliases:
          - pay
        permission: "basiceconomy.command.pay"
      reload:
        name: "reload"
        aliases: []
        permission: "basiceconomy.command.money.reload"
      help:
        name: "help"
        aliases:
          - "?"
        permission: "basiceconomy.command.money.help"
      others:
        name: "others"
        permission: "basiceconomy.command.money.others"
        offline:
          permission: "basiceconomy.command.money.others.offline"
      see:
        name: "see"
        aliases: []
        permission: "basiceconomy.command.money.others.offline"
      info:
        name: "info"
        aliases: []
        permission: "basiceconomy.command.money.info"
      top:
        name: "top"
        aliases:
          - "baltop"
        permission: "basiceconomy.command.baltop"
      history:
        name: "history"
        aliases:
          - "logs"
          - "transactions"
        permission: "basiceconomy.command.money.history"
        others:
          permission: "basiceconomy.command.money.history.others"
        stats:
          permission: "basiceconomy.command.money.history.stats"
  pay:
    name: "pay"
    aliases: []
    permission: "basiceconomy.command.pay"
    subcommands:
      offline:
        name: "offline"
        permission: "basiceconomy.command.pay.offline"
      history:
        name: "history"
        aliases:
          - "log"
          - "transactions"
        permission: "basiceconomy.command.pay.history"
  baltop:
    name: "baltop"
    aliases: []
    permission: "basiceconomy.command.baltop"
    subcommands:
      hide:
        name: "hide"
        aliases: []
        permission: "basiceconomy.command.baltop.hide"
      unhide:
        name: "unhide"
        aliases: []
        permission: "basiceconomy.command.baltop.unhide"

# Currencies
default-currency: "coins"
# Optional global compact formatting defaults (can be overridden per currency):
# compact_format: "#.##{suffix}"
# compact_suffixes: ["k", "m", "b", "t", "q"]
currencies:
  coins:
    name: "coins"
    displayname: "<gold>Coins</gold>"
    displayname_plural: "<gold>Coins</gold>"
    symbol: "<gold>⛃</gold>"
    default_format: "#,##0.00"
    compact_formatting: true
    # Compact format pattern. Example: "#.##{suffix}" or "#.## {suffix}" for a space between number and suffix.
    # Also supports "{amount} {suffix}" or "{value} {suffix}".
    compact_format: "#.##{suffix}"
    # Short currency suffixes. Supports a list of strings or comma-separated string (e.g. "k, m, b, t, q" or "K, M, B, T, Q")
    compact_suffixes:
      - "k"
      - "m"
      - "b"
      - "t"
      - "q"
    pay_enabled: true
    baltop_enabled: true
    # Optional override for the top subcommand on this currency:
    # top_subcommand:
    #   name: "top"
    #   aliases:
    #     - "baltop"
    #   permission: "basiceconomy.command.baltop"
    min_value: 0.0
    start_value: 100.0
  gems:
    name: "gems"
    displayname: "<green>Gems</green>"
    displayname_plural: "<green>Gems</green>"
    symbol: "<green>♦</green>"
    default_format: "#,##0"
    compact_formatting: true
    compact_format: "#.##{suffix}"
    compact_suffixes:
      - "k"
      - "m"
      - "b"
      - "t"
      - "q"
    pay_enabled: false
    baltop_enabled: true
    min_value: 0.0
    start_value: 0.0

# Debug logging in console
debug: false

# Player Display Formatting
# Uses MiniMessage syntax and supports MiniPlaceholders audience placeholders (e.g. <scchatuser_displayname>)
player-format: "<scchatuser_displayname>"

# Messages
# All messages support MiniMessage formatting and MiniPlaceholders (if installed).
# Common placeholders available where applicable:
#   <currency> - Currency name/identifier (e.g. coins)
#   <currency_name> - Currency name/identifier (alias for <currency>)
#   <currency_display> - Currency display name component (e.g. Coins)
#   <currency_plural> - Currency plural display name component
#   <currency_symbol> - Currency symbol component (e.g. ⛃)
#   <player> - Target/source player display or name
#   <amount> - Formatted currency amount
# Specific placeholders:
#   not_enough_money: <amount> (needed amount), <balance> (player current balance), <currency>
#   baltop_header: <currency>, <page>, <max_pages>
#   baltop_entry:  <position>, <player>, <amount>, <currency>
#   baltop_footer: <position>, <currency>
messages:
  prefix: "<gray>[<gold>BasicEconomy</gold>] </gray>"
  no_permission: "<red>You do not have permission to do this.</red>"
  player_only: "<red>Only players can use this command.</red>"
  player_not_found: "<red>Player not found or never joined.</red>"
  invalid_amount: "<red>Invalid amount specified.</red>"
  currency_not_found: "<red>Currency not found.</red>"
  
  balance_self: "<gray>Your balance: <yellow><amount></yellow></gray>"
  balance_other: "<gray><player>'s balance: <yellow><amount></yellow></gray>"
  
  pay_success: "<green>You paid <player> <amount>.</green>"
  pay_received: "<green>You received <amount> from <player>.</green>"
  pay_disabled: "<red>Payments are disabled for this currency.</red>"
  not_enough_money: "<red>You do not have enough money.</red>"
  cannot_pay_self: "<red>You cannot pay yourself.</red>"
  
  set_success: "<green>Set <player>'s balance to <amount>.</green>"
  add_success: "<green>Added <amount> to <player>'s balance.</green>"
  remove_success: "<green>Removed <amount> from <player>'s balance.</green>"
  
  baltop_header: "<gold>--- Top Balances (<currency>) ---</gold>"
  baltop_entry: "<gray><position>. <player>: <yellow><amount></yellow></gray>"
  baltop_footer: "<gray>Your position: <yellow>#<position></yellow></gray>"
  baltop_disabled: "<red>Baltop is disabled for this currency.</red>"
  baltop_hide_success: "<green>Hidden <player> from baltop.</green>"
  baltop_unhide_success: "<green>Unhidden <player> from baltop.</green>"
  baltop_already_hidden: "<red><player> is already hidden from baltop.</red>"
  baltop_not_hidden: "<red><player> is not hidden from baltop.</red>"
  
  history_header: "<gold>───────── <yellow>Payment History</yellow> (<white><page>/<max_pages></white>) ─────────</gold>"
  history_entry_received: "<green>+<amount></green> <gray>from</gray> <player> <dark_gray>•</dark_gray> <gray><time_ago></gray>"
  history_entry_sent: "<red>-<amount></red> <gray>to</gray> <player> <dark_gray>•</dark_gray> <gray><time_ago></gray>"
  history_tooltip: "<gold>Transaction #<id></gold>\n<gray>Date (UTC):</gray> <white><date></white>\n<gray>Type:</gray> <yellow><type></yellow>\n<gray>Amount:</gray> <yellow><amount></yellow>\n<gray>Sender:</gray> <white><sender></white>\n<gray>Receiver:</gray> <white><receiver></white>\n<gray>Server:</gray> <white><server></white>"
  history_footer: "<gold>───────────────────────────────────────────</gold>\n<gray>[<yellow><click:run_command:'<prev_cmd>'>« Previous</click></yellow>]</gray>  <gray>Page <page> of <max_pages></gray>  <gray>[<yellow><click:run_command:'<next_cmd>'>Next »</click></yellow>]</gray>"
  history_empty: "<gray>No payment history found.</gray>"
  history_disabled: "<red>Payment history is disabled.</red>"

  # Customizable transaction type displays (used in <type>)
  history_types:
    pay: "<yellow>Payment</yellow>"
    admin_add: "<green>Admin Grant</green>"
    admin_set: "<aqua>Admin Set</aqua>"
    admin_remove: "<red>Admin Deduction</red>"
    system: "<gray>System</gray>"

  # Customizable relative time formatting (used in <time_ago>)
  history_time:
    just_now: "just now"
    minutes_ago: "<minutes>m ago"
    hours_ago: "<hours>h ago"
    yesterday: "yesterday"
    days_ago: "<days>d ago"
    date: "<date>"
    date_format: "yyyy-MM-dd"

  history_stats_header: "<gold>─────── <yellow>Transaction Stats:</yellow> <player> (<timeframe>) ───────</gold>"
  history_stats_line_currency: "<gray>Currency:</gray> <currency_display>"
  history_stats_line_sent: "<gray>Total Sent:</gray> <red>-<amount></red> <dark_gray>(<count> transfers)</dark_gray>"
  history_stats_line_received: "<gray>Total Received:</gray> <green>+<amount></green> <dark_gray>(<count> transfers)</dark_gray>"
  history_stats_line_net: "<gray>Net Flow:</gray> <flow_color><flow_sign><amount></flow_color>"
  history_stats_line_avg: "<gray>Average Transfer:</gray> <yellow><amount></yellow>"
  history_stats_footer: "<gold>──────────────────────────────────────────────────────────</gold>"

  history_alert_high_value: "<dark_red>[Alert]</dark_red> <red>High-value transfer:</red> <sender> <gray>sent</gray> <yellow><amount></yellow> <gray>to</gray> <receiver> <dark_gray>(Tx #<id>)</dark_gray>"

  reloaded: "<green>Plugin reloaded successfully.</green>"
  
  money_help: |
    <gold>--- BasicEconomy Help ---</gold>
    <gray>/money - Check your balance</gray>
    <gray>/money <player> - Check player's balance</gray>
    <gray>/money see <player> [currency] - Check player's balance (including offline)</gray>
    <gray>/money help - Show this help menu</gray>
    <gray>/money info - Show plugin information</gray>
    <gray>/money reload - Reload configuration</gray>
    <gray>/money add <player> <amount> [currency] - Add balance</gray>
    <gray>/money set <player> <amount> [currency] - Set balance</gray>
    <gray>/money remove <player> <amount> [currency] - Remove balance</gray>
    <gray>/money send <player> <amount> [currency] - Pay player</gray>
    <gray>/money top [currency] [page] - Show balance top list</gray>
    <gray>/pay <player> <amount> [currency] - Pay player</gray>
    <gray>/pay history [sent|received] [currency] [page] - View payment history</gray>
    <gray>/money history <player> [sent|received] [currency] [page] - View player's history</gray>
    <gray>/money history stats <player> [currency] [timeframe] - View payment statistics</gray>
    <gray>/baltop [currency] - Show balance top list</gray>
    <gray>/baltop hide <player> - Hide a player from baltop</gray>
    <gray>/baltop unhide <player> - Unhide a player from baltop</gray>
    
  money_info: |
    <gold>--- BasicEconomy Info ---</gold>
    <gray>Server Version: <white><server_version></white></gray>
    <gray>Platform: <white><platform></white></gray>
    <gray>Database Type: <white><db_type></white></gray>
    <gray>Legacy Vault Hook: <white><vault_hook></white></gray>
    <gray>Modern Vault Hook: <white><vault2_hook></white></gray>
    <gray>PlaceholderAPI Hook: <white><papi_hook></white></gray>
